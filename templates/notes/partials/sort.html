{% load i18n %}
{% load url_utils %}
<div class="filter-group">
   <span class="filter-label">{% trans "Sort:" %}</span>
   <a href="?{% url_replace sort='newest' %}"
      class="filter-pill {% if current_sort == 'newest' or not current_sort %}active{% endif %}">{% trans "Newest" %}</a>
   <a href="?{% url_replace sort='oldest' %}"
      class="filter-pill {% if current_sort == 'oldest' %}active{% endif %}">{% trans "Oldest" %}</a>
   <a href="?{% url_replace sort='highest_rated' %}"
      class="filter-pill {% if current_sort == 'highest_rated' %}active{% endif %}">{% trans "Highest rated" %}</a>
   <a href="?{% url_replace sort='lowest_rated' %}"
      class="filter-pill {% if current_sort == 'lowest_rated' %}active{% endif %}">{% trans "Lowest rated" %}</a>
   {% if show_forks_sort %}
      <a href="?{% url_replace sort='most_forked' %}"
         class="filter-pill {% if current_sort == 'most_forked' %}active{% endif %}">{% trans "Most forked" %}</a>
   {% endif %}
</div>
