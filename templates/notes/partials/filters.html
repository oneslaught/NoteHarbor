<div class="filters">
    <div class="filter-group">
        <span class="filter-label">Course:</span>
        <a href="?{% if request.GET.search %}search={{ request.GET.search }}{% endif %}"
           class="filter-pill {% if not current_course %}active{% endif %}">All</a>
        {% for course in courses %}
            <a href="?{% if request.GET.search %}search={{ request.GET.search }}&{% endif %}course={{ course.id }}"
               class="filter-pill {% if current_course == course.id|stringformat:'s' %}active{% endif %}">
                {{ course.name }}
            </a>
        {% endfor %}
    </div>
    {% include "notes/partials/sort.html" %}
    {% include "notes/partials/tag_filter.html" %}
</div>
