{% if request.user.is_authenticated %}
    <div class="card-actions">
        <button class="card-action-btn favorite-btn {% if note.pk in saved_note_ids %}saved{% endif %}"
                data-pk="{{ note.pk }}"
                data-csrf="{{ csrf_token }}">★</button>
        {% if request.user == note.author or request.user.profile.is_admin %}
            <button class="card-action-btn delete-btn"
                    data-pk="{{ note.pk }}"
                    data-csrf="{{ csrf_token }}">✕</button>
        {% endif %}
    </div>
{% endif %}
